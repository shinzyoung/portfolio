    <script>
    (function () {
        if (window.HybridApp && window.HybridApp.__bridgeProxy) { return; }
    
        var STORAGE_KEY = "__hybridAppBridgeBootstrap__";
        var params = null;
        var parentOrigin = "";
        var bridgeBaseUrl = "";
        var queuedCalls = [];
        var stubStore = {};
        var stub = null;
    
        function getSameOriginParentHybridApp() {
            try {
                if (window.parent && window.parent !== window && window.parent.HybridApp) { return window.parent.HybridApp; }
            } catch (e) {}
            return null;
        }
    
        function loadStoredBridgeConfig() {
            try {
                var raw = window.sessionStorage.getItem(STORAGE_KEY);
                if (!raw) { return null; }
    
                var parsed = JSON.parse(raw);
                if (parsed && typeof parsed.parentOrigin === "string" && typeof parsed.bridgeBaseUrl === "string") { return parsed; }
            } catch (e) {}
            return null;
        }
    
        function storeBridgeConfig(origin, baseUrl) {
            if (!origin || !baseUrl) { return; }
    
            try { window.sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ parentOrigin: origin, bridgeBaseUrl: baseUrl, }) ); } catch (e) {}
        }
    
        function getLiveHybridApp() {
            var sameOriginHybridApp = getSameOriginParentHybridApp();
            if (sameOriginHybridApp) { return sameOriginHybridApp; }
    
            var currentHybridApp = window.HybridApp;
            if (currentHybridApp && currentHybridApp !== stub && currentHybridApp.__bridgeProxy === true) { return currentHybridApp; }
            return null;
        }
    
        function applyCallbackSlots(realHybridApp) {
            Object.keys(stubStore).forEach(function (key) {
                if (key.indexOf("on") === 0 && typeof stubStore[key] === "function" && typeof realHybridApp[key] === "undefined") { realHybridApp[key] = stubStore[key]; }
            });
        }
    
        function flushQueuedCalls() {
            var realHybridApp = getLiveHybridApp();
            if (!realHybridApp) { return false; }
            applyCallbackSlots(realHybridApp);
            while (queuedCalls.length > 0) {
                var item = queuedCalls.shift();
                if (item && typeof item.method === "string" && typeof realHybridApp[item.method] === "function") { realHybridApp[item.method].apply(realHybridApp, item.args || []); }
            }
            return true;
        }
    
        function callOrQueue(name, args) {
            var argList = Array.prototype.slice.call(args || []);
            var realHybridApp = getLiveHybridApp();
    
            if (realHybridApp && typeof realHybridApp[name] === "function") { return realHybridApp[name].apply(realHybridApp, argList); }
            queuedCalls.push({ method: name, args: argList, });
    
            return undefined;
        }
    
        var sameOriginHybridApp = getSameOriginParentHybridApp();
        if (sameOriginHybridApp) { window.HybridApp = sameOriginHybridApp; return; }
    
        try { params = new URLSearchParams(window.location.search || ""); parentOrigin = params.get("__hybridAppParentOrigin") || ""; bridgeBaseUrl = params.get("__hybridAppBridgeBaseUrl") || ""; } catch (e) {}
    
        if (!parentOrigin || !bridgeBaseUrl) {
            var storedConfig = loadStoredBridgeConfig();
            if (storedConfig) { parentOrigin = storedConfig.parentOrigin || ""; bridgeBaseUrl = storedConfig.bridgeBaseUrl || ""; }
        }
    
        if (!parentOrigin || !bridgeBaseUrl) { return; }
    
        storeBridgeConfig(parentOrigin, bridgeBaseUrl);
        window.__HYBRIDAPP_PARENT_ORIGIN__ = parentOrigin;
    
        stub = new Proxy(stubStore, {
            get: function (target, prop) {
                if (prop in target) return target[prop];
                if (typeof prop !== "string") return undefined;
                if (prop === "then") return undefined;
    
                return function () { return callOrQueue(prop, arguments); };
            },
            set: function (target, prop, value) { target[prop] = value; return true; },
        });
    
        stub.__bridgeStub = true;
        stub.__bridgeProxy = false;
        stub.__bridgeLoading = true;
        stub.__bridgeQueue = queuedCalls;
        stub.__flushBridgeQueue = flushQueuedCalls;
    
        window.HybridApp = stub;
    
        var normalizedBase = bridgeBaseUrl.replace(/\/+$/, "");
        var script = document.createElement("script");
        script.src = normalizedBase + "/js/widget/common/chunjae.bridge.js?v=20260403";
        script.async = false;
    
        script.onload = function () { if (!flushQueuedCalls()) { console.warn("[hybrid bootstrap] bridge script loaded but real HybridApp is not ready"); } };
        script.onerror = function () { console.warn("[hybrid bootstrap] failed to load chunjae.bridge.js:", script.src); };
    
        document.head.appendChild(script);
    })();
    </script>
